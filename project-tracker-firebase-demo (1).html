<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Tracker - Firebase Demo</title>
<style>
:root{
  --bg:#F4F1EC;--nav:#1B2332;--accent:#D4622A;
  --card:#fff;--border:#DDD8D0;--text:#1B2332;--muted:#7A7468;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:900px;margin:0 auto;}

/* Header */
header{background:var(--nav);color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:20px;display:flex;align-items:center;gap:12px;}
header h1{font-size:16pt;font-weight:700;flex:1;}
header span{color:var(--accent);}
.user-info{font-size:9pt;opacity:.7;display:flex;align-items:center;gap:8px;}
.user-photo{width:24px;height:24px;border-radius:50%;vertical-align:middle;}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:5px;font-size:9.5pt;font-weight:600;cursor:pointer;font-family:inherit;}
.btn:hover{background:#B8501F;}
.btn-s{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);}
.btn-s:hover{background:rgba(255,255,255,.25);}

/* Splash */
#splash{position:fixed;inset:0;background:var(--nav);display:flex;align-items:center;justify-content:center;z-index:1000;}
.splash-card{background:var(--card);border-radius:12px;padding:40px;max-width:400px;text-align:center;}
.splash-card h1{font-size:20pt;margin-bottom:8px;}
.splash-card p{color:var(--muted);margin-bottom:24px;font-size:10pt;}
.config-box{background:#FFF7ED;border:2px solid #F59E0B;border-radius:6px;padding:12px;margin:16px 0;text-align:left;font-size:9pt;line-height:1.5;}
.config-box strong{color:#C2720A;}

/* Projects */
.add-section{background:var(--card);padding:16px;border-radius:8px;margin-bottom:16px;border:1px solid var(--border);}
.add-section h3{font-size:11pt;margin-bottom:12px;}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
.form-row input,.form-row select{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:5px;font-size:9.5pt;font-family:inherit;}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--accent);}

.projects-list{background:var(--card);border-radius:8px;border:1px solid var(--border);overflow:hidden;}
.project-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.project-item:last-child{border-bottom:none;}
.project-item:hover{background:#fafafa;}
.project-name{flex:1;font-weight:600;font-size:10pt;}
.project-meta{font-size:8.5pt;color:var(--muted);}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:7.5pt;font-weight:700;margin-right:8px;}
.status-pending{background:#FFF7ED;color:#C2720A;}
.status-active{background:#EDF7F0;color:#2D7D46;}
.status-completed{background:#EDF2FB;color:#2255A4;}
.service-tag{background:#F3F4F6;color:#374151;padding:2px 6px;border-radius:4px;font-size:7.5pt;font-weight:600;margin-right:4px;}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;}
.del-btn:hover{color:#C0392B;}
.live-indicator{display:inline-flex;align-items:center;gap:4px;font-size:8pt;color:#10B981;margin-left:8px;}
.live-dot{width:6px;height:6px;background:#10B981;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.no-projects{padding:40px;text-align:center;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-card">
    <div style="font-size:44px;margin-bottom:16px;">📋</div>
    <h1>Project<span style="color:var(--accent)">Tracker</span></h1>
    <p>Firebase Demo - Real-time Collaboration</p>
    
    <div id="auth-loading" style="display:none;padding:20px;color:var(--muted);">
      <div style="font-size:32px;margin-bottom:10px;">⏳</div>
      Checking authentication...
    </div>
    
    <div id="auth-signin" style="display:none;">
      <button class="btn" onclick="signInWithGoogle()" style="width:100%;padding:12px;font-size:11pt;">
        Sign in with Google
      </button>
    </div>
    
    <div id="auth-error" class="config-box" style="display:none;">
      <strong>⚠️ Firebase Not Configured</strong><br/>
      Open this file in a text editor and add your Firebase config (instructions in the code, line ~200).
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>Project<span>Tracker</span> <span class="live-indicator"><span class="live-dot"></span>Live</span></h1>
    <div class="user-info">
      <img id="user-photo" class="user-photo" src="" alt=""/>
      <span id="user-name"></span>
    </div>
    <button class="btn btn-s" onclick="signOut()">Sign Out</button>
  </header>

  <div class="add-section">
    <h3>➕ Add Project</h3>
    <div class="form-row">
      <input type="text" id="new-name" placeholder="Project name" />
      <select id="new-service">
        <option value="General">General</option>
        <option value="LSO">LSO</option>
        <option value="NMG">NMG</option>
        <option value="NRM">NRM</option>
        <option value="SMA">SMA</option>
        <option value="THR">THR</option>
      </select>
      <select id="new-status">
        <option value="pending">Pending</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <button class="btn" onclick="addProject()">Add Project</button>
  </div>

  <div class="projects-list" id="projects-list">
    <div class="no-projects">No projects yet. Add one above!</div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// 🔥 FIREBASE SETUP - FOLLOW THESE STEPS:
// ═══════════════════════════════════════════════════════════════════════════
// 
// 1. Go to https://console.firebase.google.com/
// 2. Click "Add project" (or use existing one)
// 3. Name it (e.g., "project-tracker")
// 4. Click "Add app" → choose Web (</> icon)
// 5. Copy the config object and paste it below (replace the placeholder)
// 
// 6. Enable Firestore Database:
//    - In left menu: Build → Firestore Database → Create database
//    - Start in "test mode" (for now)
//    - Choose a location
// 
// 7. Enable Google Authentication:
//    - In left menu: Build → Authentication → Get started
//    - Click "Sign-in method" tab
//    - Enable "Google"
//    - Click Save
// 
// 8. Save this file and open it in Chrome/Edge
// 
// ═══════════════════════════════════════════════════════════════════════════

const firebaseConfig = {
  apiKey: "AIzaSyBk2WUU8jPgAze2J2Y8cnFiKUZN0MzPIFc",
  authDomain: "project-tracker-855a8.firebaseapp.com",
  projectId: "project-tracker-855a8",
  storageBucket: "project-tracker-855a8.firebasestorage.app",
  messagingSenderId: "46582598296",
  appId: "1:46582598296:web:ff818b885049366b3b9eed",
  measurementId: "G-G15M136MTH"
};

// Check if configured
const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY_HERE";

if (!isConfigured) {
  document.getElementById('auth-error').style.display = 'block';
  document.getElementById('auth-signin').style.display = 'none';
} else {
  document.getElementById('auth-loading').style.display = 'block';
}

// Initialize Firebase
let auth, db, currentUser;

if (isConfigured) {
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    
    // Listen for auth state
    auth.onAuthStateChanged(user => {
      document.getElementById('auth-loading').style.display = 'none';
      if (user) {
        currentUser = user;
        document.getElementById('user-name').textContent = user.displayName;
        document.getElementById('user-photo').src = user.photoURL;
        document.getElementById('splash').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadProjects();
      } else {
        document.getElementById('auth-signin').style.display = 'block';
      }
    });
  } catch (err) {
    console.error('Firebase init error:', err);
    document.getElementById('auth-error').textContent = 'Firebase error: ' + err.message;
    document.getElementById('auth-error').style.display = 'block';
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// AUTHENTICATION
// ═══════════════════════════════════════════════════════════════════════════

function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    alert('Sign-in error: ' + err.message);
  });
}

function signOut() {
  auth.signOut();
}

// ═══════════════════════════════════════════════════════════════════════════
// FIRESTORE - REAL-TIME PROJECTS
// ═══════════════════════════════════════════════════════════════════════════

let unsubscribe = null;

function loadProjects() {
  // Set up real-time listener
  unsubscribe = db.collection('projects')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snapshot => {
      const projects = [];
      snapshot.forEach(doc => {
        projects.push({ id: doc.id, ...doc.data() });
      });
      renderProjects(projects);
    }, err => {
      console.error('Firestore error:', err);
      alert('Database error: ' + err.message);
    });
}

function renderProjects(projects) {
  const list = document.getElementById('projects-list');
  
  if (!projects.length) {
    list.innerHTML = '<div class="no-projects">No projects yet. Add one above!</div>';
    return;
  }
  
  list.innerHTML = projects.map(p => `
    <div class="project-item">
      <div style="flex:1;">
        <div class="project-name">${esc(p.name)}</div>
        <div class="project-meta">
          <span class="service-tag">${esc(p.service)}</span>
          <span class="status-badge status-${p.status}">${cap(p.status)}</span>
          <span style="opacity:.6;">Added by ${esc(p.createdBy)}</span>
        </div>
      </div>
      <button class="del-btn" onclick="deleteProject('${p.id}')" title="Delete">✕</button>
    </div>
  `).join('');
}

function addProject() {
  const name = document.getElementById('new-name').value.trim();
  const service = document.getElementById('new-service').value;
  const status = document.getElementById('new-status').value;
  
  if (!name) {
    alert('Please enter a project name');
    return;
  }
  
  db.collection('projects').add({
    name,
    service,
    status,
    createdBy: currentUser.displayName,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    document.getElementById('new-name').value = '';
    document.getElementById('new-name').focus();
  }).catch(err => {
    alert('Error adding project: ' + err.message);
  });
}

function deleteProject(id) {
  if (!confirm('Delete this project?')) return;
  db.collection('projects').doc(id).delete().catch(err => {
    alert('Error deleting: ' + err.message);
  });
}

// Helpers
function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

// Cleanup on close
window.addEventListener('beforeunload', () => {
  if (unsubscribe) unsubscribe();
});
</script>

</body>
</html>
